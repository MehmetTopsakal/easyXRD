[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyxrd"
version = "2026.10.20.post1"
description = "X-ray diffraction analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Mehmet Topsakal"}]
dependencies = [
    "numpy", "scipy", "xarray", "matplotlib", "ipython",
    "pymatgen", "pyFAI", "fabio", "pybaselines", "h5netcdf", "h5py", "mp-api"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipympl", "ipywidgets"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/MehmetTopsakal/easyXRD"

[tool.setuptools]
packages = ["easyxrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
easyxrd = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
pip = "*"
ninja = "*"
meson-python = "*"
git = "*"
pytest = "*"

[tool.pixi.target.linux-64.dependencies]
fortran-compiler = "*"
c-compiler = "*"


