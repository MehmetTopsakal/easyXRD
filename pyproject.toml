[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyxrd"
version = "2026.11.13"
description = "X-ray diffraction analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Mehmet Topsakal"}]
dependencies = [
    "numpy", "scipy", "xarray", "matplotlib", "ipython",
    "pymatgen", "pyFAI", "fabio", "pybaselines", "h5netcdf", "h5py", "mp-api",
    # mp-api's unconstrained transitive dependency can select legacy boto3/six
    # releases whose import hooks are incompatible with modern Python.
    "boto3>=1.34", "six>=1.17"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipympl", "ipywidgets"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/MehmetTopsakal/easyXRD"

[tool.setuptools]
packages = ["easyxrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
easyxrd = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
pip = "*"
ninja = "*"
meson-python = "*"
git = "*"
pytest = "*"
black = ">=26.10.1,<27"

[tool.pixi.target.linux-64.dependencies]
fortran-compiler = "*"
c-compiler = "*"



[tool.pixi.target.osx-64.dependencies]
fortran-compiler = "*"
c-compiler = "*"

[tool.pixi.target.osx-arm64.dependencies]
fortran-compiler = "*"
c-compiler = "*"
